name: Deploy portfolio to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Upload and verify website
        env:
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: python3 scripts/deploy_hostinger.py
      - name: Check public website
        run: |
          curl --fail --silent --show-error --retry 3 https://artaabdullahu.com/ -o /tmp/live-index.html
          cmp dist/index.html /tmp/live-index.html
