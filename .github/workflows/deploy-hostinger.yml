name: Deploy portfolio to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Upload and verify website
        env:
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: python3 scripts/deploy_hostinger.py
      - name: Check public website
        run: |
          status=$(curl --silent --show-error --retry 3 --location \
            --user-agent 'Mozilla/5.0 (compatible; PortfolioDeployment/1.0)' \
            --write-out '%{http_code}' https://artaabdullahu.com/ -o /tmp/live-index.html)
          if [ "$status" = 403 ]; then
            echo "::warning::Hostinger denied the GitHub runner's public HTTP check. All uploaded files were verified over FTPS."
            exit 0
          fi
          if [ "$status" != 200 ]; then
            echo "::error::Public website returned HTTP $status"
            exit 1
          fi
          cmp dist/index.html /tmp/live-index.html
